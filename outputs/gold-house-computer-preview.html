<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gold House AI Training</title>
  <style>
    :root{--bg:#fff;--surface:#f8f5ef;--text:#161412;--muted:#776f67;--line:#e9e0d3;--accent:#a9793b;--accent-dark:#6f4a22;--accent-soft:#f1e5d2;--black:#0d0d0d;--danger:#f5ede8;--shadow:0 18px 48px rgba(42,33,24,.1)}
    *{box-sizing:border-box} body{margin:0;background:var(--surface);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button{border:0;border-radius:16px;cursor:pointer;font:inherit;font-weight:850;min-height:52px;padding:13px 18px} h1,h2,h3,p{margin:0}
    h1{font-size:clamp(42px,7vw,76px);line-height:.95;max-width:760px} h2{font-size:clamp(30px,4vw,48px);line-height:1.04} h3{font-size:21px}
    .app{max-width:1120px;min-height:100vh;margin:0 auto;background:var(--bg)} .topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.92);z-index:4}
    .brand{color:var(--accent-dark);font-size:14px;font-weight:950;text-transform:uppercase}.screen{min-height:calc(100vh - 66px);padding:34px 22px 48px;animation:fade .25s ease both}
    .hero{display:grid;align-items:end;min-height:calc(100vh - 66px);padding:34px 22px 54px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.98)),url("https://images.unsplash.com/photo-1600607688969-a5bfcd646154?auto=format&fit=crop&w=1600&q=80") center/cover}
    .sub{color:var(--muted);font-size:17px;line-height:1.55;margin-top:14px;max-width:660px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}.primary{background:var(--black);color:#fff}.soft{background:var(--accent-soft);color:var(--accent-dark)}.ghost{background:var(--surface);color:var(--text)}.danger{background:var(--danger);color:#8b3528}
    .progress{height:7px;border-radius:999px;background:var(--surface);overflow:hidden;margin-bottom:20px}.progress span{display:block;height:100%;width:var(--p);background:var(--accent);transition:width .25s ease}.step{display:flex;justify-content:space-between;color:var(--accent-dark);font-size:13px;font-weight:900;text-transform:uppercase;margin-bottom:8px}
    .grid{display:grid;gap:14px;margin-top:24px}.choices{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.choice,.card,.section{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.choice{text-align:left;padding:22px;min-height:88px}.choice.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dark)}.choice b{display:block;font-size:18px}.choice span{display:block;color:var(--muted);font-size:14px;line-height:20px;margin-top:5px}
    .loading{display:grid;place-items:center;text-align:center;min-height:calc(100vh - 170px)}.ai{width:108px;height:108px;border-radius:32px;background:var(--black);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:950;margin:0 auto 24px;animation:pulse 1.25s infinite}
    .rec{overflow:hidden}.rec img,.detail-img{width:100%;height:320px;object-fit:cover;display:block;background:var(--surface)}.body{padding:22px;display:grid;gap:12px}.badges{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}.badge{display:inline-flex;border-radius:10px;background:var(--accent-soft);color:var(--accent-dark);font-size:12px;font-weight:900;padding:7px 10px}.price{font-size:30px;font-weight:950}.meta{color:var(--muted);font-size:15px;line-height:22px}
    .stages{display:grid;gap:12px;margin-top:24px}.stage{border:1px solid var(--line);border-radius:18px;background:#fff;padding:16px;font-weight:850;color:var(--muted)}.stage.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dark)}
    .section{padding:20px;margin-top:16px}.detail-actions{position:sticky;bottom:0;background:rgba(255,255,255,.94);border-top:1px solid var(--line);padding:14px;display:grid;gap:10px}
    .field{display:grid;gap:7px;margin-top:14px}.field span{color:var(--muted);font-size:13px;font-weight:850}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--text);font:inherit;font-weight:650;min-height:52px;padding:13px 15px}textarea{min-height:110px;resize:vertical}.status{display:inline-flex;border-radius:10px;background:var(--accent-soft);color:var(--accent-dark);font-size:12px;font-weight:900;padding:7px 10px}.owner-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.admin-note{border:1px dashed var(--accent);border-radius:20px;background:var(--accent-soft);padding:16px;color:var(--accent-dark);font-weight:800}.owner-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.owner-step{color:var(--accent-dark);font-size:13px;font-weight:950;text-transform:uppercase}.choice-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.pill{border:1px solid var(--line);background:#fff;color:var(--text);min-height:44px;border-radius:14px;padding:10px 14px}.pill.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dark)}.media-section{border:1px solid var(--line);border-radius:20px;background:var(--surface);padding:16px;margin-top:14px}.media-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.thumbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}.thumb{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}.thumb img,.thumb .video-box{width:100%;height:92px;object-fit:cover;background:var(--black);color:#fff;display:grid;place-items:center;font-size:24px}.thumb-body{padding:10px;display:grid;gap:8px}.mini{font-size:12px;min-height:34px;padding:7px 10px;border-radius:10px}.owner-list{display:grid;gap:10px;margin-top:12px}.owner-list div{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}.success{display:grid;place-items:center;text-align:center;min-height:calc(100vh - 170px)}.admin-link{margin-top:22px;background:transparent;color:var(--muted);font-size:11px;opacity:.45;min-height:32px;padding:4px 8px;text-transform:uppercase}.admin-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-top:18px}.admin-stat{border:1px solid var(--line);border-radius:20px;background:#fff;padding:16px}.admin-stat b{display:block;font-size:28px}.admin-card{border:1px solid var(--line);border-radius:22px;background:#fff;padding:18px;margin-top:12px}.admin-card:hover{border-color:var(--accent)}.admin-facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.admin-fact{border-radius:999px;background:var(--surface);padding:7px 10px;font-size:12px;font-weight:850}.pinbox{max-width:520px;margin:0 auto}.admin-detail-grid{display:grid;gap:10px}.admin-line{border-bottom:1px solid var(--line);padding:10px 0}.admin-line span{display:block;color:var(--muted);font-size:12px;font-weight:900;text-transform:uppercase}.admin-line b{display:block;margin-top:4px}.tiny-media{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px}.tiny-media div{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);font-weight:850}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes pulse{0%,100%{transform:scale(.82)}50%{transform:scale(1)}}@media(max-width:720px){.screen{padding:24px 16px 36px}.hero{padding:24px 16px 42px}.actions button{width:100%}}
  </style>
</head>
<body>
  <main class="app"><div class="topbar"><div class="brand">Gold House</div><button class="ghost" onclick="reset()">Сначала</button></div><div id="root"></div></main>
  <script>
    const districts=['Бостандыкский','Алмалинский','Медеуский','Ауэзовский','Наурызбайский','Турксибский','Жетысуский','Алатауский'];
    const budgets=[['До 30 млн ₸',0,30000000],['30-45 млн ₸',30000000,45000000],['45-60 млн ₸',45000000,60000000],['60-80 млн ₸',60000000,80000000],['80-100 млн ₸',80000000,100000000],['100+ млн ₸',100000000,999000000]];
    const floors=[['any','Любые этажи','Покажем все варианты'],['notFirst','Только не первый','Исключим первый этаж'],['notLast','Только не последний','Исключим последний этаж'],['middle','Только средние этажи','Не первый и не последний']];
    const props=[
      p('gh1','Бостандыкский','ул. Гагарина, 124',58500000,3,82,5,11,97,'https://images.unsplash.com/photo-1600573472550-8090b5e0745e?auto=format&fit=crop&w=1400&q=80'),
      p('gh2','Алмалинский','ул. Шевченко, 85',28500000,1,41,4,10,94,'https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=1400&q=80'),
      p('gh3','Бостандыкский','ул. Розыбакиева, 247',36500000,2,58,1,12,96,'https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=1400&q=80'),
      p('gh4','Медеуский','пр. Достык, 138',48200000,3,76,6,9,94,'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1400&q=80'),
      p('gh5','Наурызбайский','мкр. Таусамалы, 38',41200000,2,63,7,12,91,'https://images.unsplash.com/photo-1600566752355-35792bedcfea?auto=format&fit=crop&w=1400&q=80'),
      p('gh6','Алатауский','мкр. Нуркент, 45',61200000,4,112,1,10,91,'https://images.unsplash.com/photo-1618220179428-22790b461013?auto=format&fit=crop&w=1400&q=80'),
      p('gh7','Ауэзовский','пр. Абая, 157',27600000,1,39,1,5,88,'https://images.unsplash.com/photo-1600121848594-d8644e57abab?auto=format&fit=crop&w=1400&q=80'),
      p('gh8','Жетысуский','пр. Райымбека, 212',45500000,3,78,5,12,90,'https://images.unsplash.com/photo-1600607688066-890987f18a86?auto=format&fit=crop&w=1400&q=80'),
      p('gh9','Турксибский','ул. Сейфуллина, 12',32500000,2,54,3,9,89,'https://images.unsplash.com/photo-1600566752229-250ed79470f8?auto=format&fit=crop&w=1400&q=80'),
      p('gh10','Медеуский','ул. Кунаева, 21',70500000,4,118,8,12,95,'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1400&q=80')
    ];
    const s={screen:1,district:'Бостандыкский',budget:budgets[1],rooms:'2',floor:'any',ratings:[],views:[],stage:0,selected:null,date:'Завтра',time:'18:30'};
    const owner={step:1,name:'',phone:'',submitted:false,form:{city:'Алматы',district:'Бостандыкский',complex:'',address:'',rooms:'2',totalArea:'',livingArea:'',kitchenArea:'',floor:'',totalFloors:'',year:'',material:'',ceilingHeight:'',bathroom:'Раздельный',balcony:'Да',elevator:'Да',parking:'Нет',priceRaw:'',bargain:'Нет',mortgage:'Да',documentsReady:'Да',encumbrance:'Нет',repairState:'Хороший ремонт',repairComment:'',furniture:'Частично',appliances:'Частично',remains:'',likes:'',minuses:'',fitFor:'',sellingReason:'',photos:{apartment:[],yard:[],entrance:[],view:[]},videos:{apartment:[],yard:[],entrance:[],owner:[]}},submissions:[{title:'ЖК Gold Residence',address:'ул. Гагарина, 124',status:'На проверке',price:'58 500 000 ₸',meta:'3 комн. · 82 м² · 5/11 этаж'}]};
    const buyer={name:'',phone:'',active:null,guest:false,message:'',profiles:[],signals:[],preferences:[]};
    const admin={pin:'',error:'',authed:false,selected:null};
    const root=document.getElementById('root'); const phone='+7 777 245 88 11';
    function p(id,district,address,price,rooms,area,floor,totalFloors,match,image){return{id,district,address,price,rooms,area,floor,totalFloors,match,image}}
    function money(v){return new Intl.NumberFormat('ru-RU').format(v)+' ₸'} function reset(){Object.assign(s,{screen:1,district:'Бостандыкский',budget:budgets[1],rooms:'2',floor:'any',ratings:[],views:[],stage:0,selected:null});render()}
    function next(n){s.screen=n;render();scrollTo({top:0,behavior:'smooth'})} function prog(n){return`<div class="step"><span>Шаг ${n} из 8</span><span>${Math.round(n/8*100)}%</span></div><div class="progress" style="--p:${Math.round(n/8*100)}%"><span></span></div>`}
    function card(label,sel,act,sub=''){return`<button class="choice ${sel?'active':''}" onclick="${act}"><b>${label}</b>${sub?`<span>${sub}</span>`:''}</button>`}
    function score(x){let v=x.match+(x.district===s.district?26:6)+(s.rooms==='4+'?x.rooms>=4?24:0:x.rooms==Number(s.rooms)?24:0)+(x.price>=s.budget[1]&&x.price<=s.budget[2]?22:6); if(s.floor==='notFirst'&&x.floor===1)v-=30;if(s.floor==='notLast'&&x.floor===x.totalFloors)v-=30;if(s.floor==='middle'&&(x.floor===1||x.floor===x.totalFloors))v-=30;if(s.ratings.some(r=>r.id===x.id&&r.type==='like'))v+=28;if(s.views.includes(x.id))v+=12;if(s.ratings.some(r=>r.id===x.id&&r.type==='dislike'))v-=40;return v}
    function stream(){return props.slice(0,10)} function current(){return stream()[Math.min(s.ratings.length,9)]}
    function setOwnerField(key,value){owner.form[key]=value;if((key==='furniture'||key==='appliances')&&owner.form.furniture==='Не остается'&&owner.form.appliances==='Не остается')owner.form.remains='Ничего не остается.'}
    function setOwnerPrice(value){owner.form.priceRaw=value.replace(/\D/g,'');render()}
    function ownerMoney(){return owner.form.priceRaw?money(Number(owner.form.priceRaw)):'Цена не указана'}
    function ownerTitle(){return ['Адрес','Основные характеристики','Цена и условия','Ремонт и состояние','Что остается после продажи','Описание от собственника','Фото','Видео','Предпросмотр'][owner.step-1]}
    function ownerProgress(){const pct=Math.round(owner.step/9*100);return`<div class="step"><span>Шаг ${owner.step} из 9</span><span>${pct}%</span></div><div class="progress" style="--p:${pct}%"><span></span></div>`}
    function ownerInput(key,label,placeholder='',textarea=false){const value=owner.form[key]||'';return`<label class="field"><span>${label}</span>${textarea?`<textarea oninput="setOwnerField('${key}',this.value)" placeholder="${placeholder}">${value}</textarea>`:`<input value="${value}" oninput="setOwnerField('${key}',this.value)" placeholder="${placeholder}">`}</label>`}
    function ownerSelect(key,label,options){return`<label class="field"><span>${label}</span><select onchange="setOwnerField('${key}',this.value)">${options.map(o=>`<option ${owner.form[key]===o?'selected':''}>${o}</option>`).join('')}</select></label>`}
    function ownerChoices(key,label,options){return`<div class="field"><span>${label}</span><div class="choice-row">${options.map(o=>`<button class="pill ${owner.form[key]===o?'active':''}" onclick="setOwnerField('${key}','${o}');render()">${o}</button>`).join('')}</div></div>`}
    function addOwnerMedia(type,section,label){const bucket=owner.form[type][section];bucket.push({name:label+' '+(bucket.length+1),url:'https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=600&q=80'});render()}
    function deleteOwnerMedia(type,section,index){owner.form[type][section].splice(index,1);render()}
    function mediaBlock(type,section,title){const list=owner.form[type][section];const isPhoto=type==='photos';return`<div class="media-section"><div class="media-top"><div><h3>${title}</h3><p class="meta">Загружено: ${list.length}</p></div><button class="soft" onclick="addOwnerMedia('${type}','${section}','${title}')">${isPhoto?'Добавить фото':'Добавить видео'}</button></div><div class="thumbs">${list.map((m,i)=>`<div class="thumb">${isPhoto?`<img src="${m.url}">`:'<div class="video-box">Play</div>'}<div class="thumb-body"><b>${m.name}</b><button class="ghost mini" onclick="deleteOwnerMedia('${type}','${section}',${i})">Удалить</button></div></div>`).join('')}</div></div>`}
    function ownerBody(){const f=owner.form;if(owner.step===1)return`<div class="owner-row">${ownerInput('city','Город')}${ownerSelect('district','Район',districts)}${ownerInput('complex','ЖК / название дома','ЖК Central Park')}${ownerInput('address','Адрес','Улица, дом, корпус')}</div>`;if(owner.step===2)return`${ownerChoices('rooms','Количество комнат',['1','2','3','4','5+'])}<div class="owner-row">${ownerInput('totalArea','Общая площадь','82')}${ownerInput('livingArea','Жилая площадь','54')}${ownerInput('kitchenArea','Площадь кухни','14')}${ownerInput('floor','Этаж','5')}${ownerInput('totalFloors','Этажность дома','11')}${ownerInput('year','Год постройки','2023')}${ownerInput('material','Материал дома','Монолит')}${ownerInput('ceilingHeight','Высота потолков','3.0')}</div>${ownerChoices('bathroom','Санузел',['Совмещенный','Раздельный','2 санузла'])}${ownerChoices('balcony','Балкон',['Да','Нет'])}${ownerChoices('elevator','Лифт',['Да','Нет'])}${ownerChoices('parking','Парковка',['Да','Нет'])}`;if(owner.step===3)return`<label class="field"><span>Цена</span><input value="${f.priceRaw?money(Number(f.priceRaw)):''}" oninput="setOwnerPrice(this.value)" placeholder="58 000 000 ₸"></label>${ownerChoices('bargain','Возможен ли торг?',['Да','Нет'])}${ownerChoices('mortgage','Можно ли купить в ипотеку?',['Да','Нет'])}${ownerChoices('documentsReady','Документы готовы к сделке?',['Да','Нужно уточнить'])}${ownerChoices('encumbrance','Есть ли обременения?',['Нет','Есть','Нужно уточнить'])}`;if(owner.step===4)return`${ownerChoices('repairState','Состояние ремонта',['Хороший ремонт','Средний ремонт','Требуется ремонт','Черновая отделка','Предчистовая отделка'])}${ownerInput('repairComment','Комментарий по ремонту','ремонт делали 3 года назад',true)}`;if(owner.step===5)return`${ownerChoices('furniture','Мебель',['Полностью','Частично','Не остается'])}${ownerChoices('appliances','Техника',['Полностью','Частично','Не остается'])}${ownerInput('remains','Что именно остается?','Например: кухонный гарнитур, кондиционер, холодильник, стиральная машина, шкаф.',true)}`;if(owner.step===6)return`${ownerInput('likes','Что вам нравится в квартире?','Свет, планировка, двор...',true)}${ownerInput('minuses','Какие есть честные минусы?','Например: нужно обновить санузел',true)}${ownerInput('fitFor','Кому подойдет квартира?','Семье, паре, инвестору...',true)}${ownerInput('sellingReason','Почему продаете?','Переезд, расширение...',true)}`;if(owner.step===7)return`<p class="meta">Mock upload: нажмите “Добавить фото”, чтобы файл появился в интерфейсе. Фото можно удалить.</p>${mediaBlock('photos','apartment','Фото квартиры')}${mediaBlock('photos','yard','Фото двора')}${mediaBlock('photos','entrance','Фото подъезда')}${mediaBlock('photos','view','Фото вида из окна')}`;if(owner.step===8)return`<div class="admin-note">Видео собственника: 1. Представьтесь. 2. Почему продаете квартиру? 3. Что больше всего нравится? 4. Какие честные минусы? 5. Кому подойдет? 6. Если бы не продавали, за что продолжали бы жить здесь?</div>${mediaBlock('videos','apartment','Видео квартиры')}${mediaBlock('videos','yard','Видео двора')}${mediaBlock('videos','entrance','Видео подъезда')}${mediaBlock('videos','owner','Видео собственника')}`;return ownerPreview()}
    function ownerPreview(){const f=owner.form;const photo=f.photos.apartment[0]?.url||'https://images.unsplash.com/photo-1600573472550-8090b5e0745e?auto=format&fit=crop&w=1400&q=80';const photos=Object.values(f.photos).reduce((n,a)=>n+a.length,0);const videos=Object.values(f.videos).reduce((n,a)=>n+a.length,0);return`<article class="card rec"><img src="${photo}"><div class="body"><div class="badges"><span class="badge">Gold Verified: ожидает проверки</span><span class="badge">Trust Index: будет рассчитан</span><span class="badge">Статус: черновик</span></div><p class="price">${ownerMoney()}</p><h3>${f.complex||'Новая квартира'}</h3><p class="meta">${f.city}, ${f.district} · ${f.address||'Адрес уточняется'}</p><p class="meta">${f.rooms} комн. · ${f.totalArea||'-'} м² · ${f.floor||'-'}/${f.totalFloors||'-'} этаж</p><div class="owner-list"><div><b>Характеристики</b><p class="meta">Жилая: ${f.livingArea||'-'} м² · Кухня: ${f.kitchenArea||'-'} м² · Год: ${f.year||'-'} · Материал: ${f.material||'-'} · Потолки: ${f.ceilingHeight||'-'}</p></div><div><b>Ремонт</b><p class="meta">${f.repairState}. ${f.repairComment||'Комментарий не указан.'}</p></div><div><b>Мебель / техника</b><p class="meta">Мебель: ${f.furniture} · Техника: ${f.appliances} · ${f.remains||'Что остается не указано.'}</p></div><div><b>Описание</b><p class="meta">${f.likes||'Описание будет дополнено.'} ${f.minuses?'<br>Минусы: '+f.minuses:''} ${f.fitFor?'<br>Кому подойдет: '+f.fitFor:''} ${f.sellingReason?'<br>Почему продаете: '+f.sellingReason:''}</p></div><div><b>Медиа</b><p class="meta">Фото: ${photos} · Видео: ${videos}</p></div></div></div></article>`}
    function saveOwnerSubmission(status){owner.submissions.unshift({id:'sub-'+Date.now(),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),ownerName:owner.name||'Собственник',ownerPhone:owner.phone||'+7',title:owner.form.complex||'Новая квартира',address:owner.form.address||'Адрес уточняется',status,price:ownerMoney(),meta:`${owner.form.rooms} комн. · ${owner.form.totalArea||'-'} м² · ${owner.form.floor||'-'}/${owner.form.totalFloors||'-'} этаж`,form:cloneOwnerForm()});if(status==='Отправлена'){owner.submitted=true;s.screen=25}else{s.screen=21}render()}
    function cloneOwnerForm(){return JSON.parse(JSON.stringify(owner.form))}
    function adminStatusList(){return ['Отправлена','На проверке','Нужна съемка','Одобрена','Опубликовано','Отклонено']}
    function statusCount(status){return owner.submissions.filter(x=>x.status===status).length}
    function adminLogin(){if(admin.pin==='0707'){admin.authed=true;admin.error='';next(31)}else{admin.error='Неверный PIN-код';render()}}
    function openAdminSubmission(index){admin.selected=index;next(32)}
    function selectedAdminSubmission(){return owner.submissions[admin.selected]||owner.submissions[0]}
    function setAdminStatus(status){const item=selectedAdminSubmission();item.status=status;item.updatedAt=new Date().toISOString();if(status==='Опубликовано')publishAdminSubmission(item);render()}
    function publishAdminSubmission(item){const id='pub-'+(item.id||item.title).replace(/\W+/g,'-');if(props.some(p=>p.id===id))return;const f=item.form||owner.form;props.unshift(p(id,f.district||'Бостандыкский',f.address||item.address||'Адрес уточняется',Number(f.priceRaw||String(item.price||'').replace(/\D/g,'')||0),Number(String(f.rooms||2).replace(/\D/g,'')||2),Number(f.totalArea||f.area||0),Number(f.floor||1),Number(f.totalFloors||1),98,(f.photos?.apartment?.[0]?.url)||'https://images.unsplash.com/photo-1600573472550-8090b5e0745e?auto=format&fit=crop&w=1400&q=80'))}
    function adminSubmissionCard(item,index){const f=item.form||owner.form;return`<button class="admin-card" onclick="openAdminSubmission(${index})" style="text-align:left;width:100%"><div class="badges"><span class="badge">${item.status}</span><span class="badge">${item.id||'local'}</span></div><h3 style="margin-top:12px">${item.title}</h3><p class="meta">${item.createdAt?new Date(item.createdAt).toLocaleDateString('ru-RU'):'Сегодня'} · ${item.ownerName||owner.name||'Собственник'} · ${item.ownerPhone||owner.phone||'+7'}</p><div class="admin-facts"><span class="admin-fact">${f.district||'-'}</span><span class="admin-fact">${f.rooms||'-'} комн.</span><span class="admin-fact">${f.totalArea||f.area||'-'} м²</span><span class="admin-fact">${f.floor||'-'}/${f.totalFloors||'-'} этаж</span></div><p class="price" style="font-size:24px;margin-top:12px">${item.price}</p></button>`}
    function adminLine(label,value){return`<div class="admin-line"><span>${label}</span><b>${value||'-'}</b></div>`}
    function adminDetail(){const item=selectedAdminSubmission();const f=item.form||owner.form;const photos=Object.values(f.photos||{}).flat();const videos=Object.values(f.videos||{}).flat();return`<section class="screen"><button class="ghost" onclick="next(31)">← В админку</button><div class="owner-head"><div><p class="owner-step">Gold Admin</p><h2>${item.title}</h2><p class="sub">${item.id||'local'} · ${item.status}</p></div><span class="status">${item.status}</span></div><div class="section"><h3>Действия администратора</h3><div class="actions"><button class="soft" onclick="setAdminStatus('На проверке')">Взять в работу</button><button class="soft" onclick="setAdminStatus('Нужна съемка')">Требуется съемка</button><button class="soft" onclick="setAdminStatus('Одобрена')">Одобрить</button><button class="primary" onclick="setAdminStatus('Опубликовано')">Опубликовать</button><button class="ghost" onclick="setAdminStatus('Отклонено')">Отклонить</button></div></div><div class="section"><h3>Адрес</h3><div class="admin-detail-grid">${adminLine('Город',f.city)}${adminLine('Район',f.district)}${adminLine('ЖК / дом',f.complex)}${adminLine('Адрес',f.address)}</div></div><div class="section"><h3>Характеристики</h3>${adminLine('Комнаты',f.rooms)}${adminLine('Площадь',`${f.totalArea||f.area||'-'} м²`)}${adminLine('Жилая',`${f.livingArea||'-'} м²`)}${adminLine('Кухня',`${f.kitchenArea||'-'} м²`)}${adminLine('Этаж',`${f.floor||'-'}/${f.totalFloors||'-'}`)}${adminLine('Год',f.year)}${adminLine('Материал',f.material)}${adminLine('Потолки',f.ceilingHeight)}${adminLine('Санузел',f.bathroom)}${adminLine('Балкон',f.balcony)}${adminLine('Лифт',f.elevator)}${adminLine('Парковка',f.parking)}</div><div class="section"><h3>Цена и условия</h3>${adminLine('Цена',item.price)}${adminLine('Торг',f.bargain)}${adminLine('Ипотека',f.mortgage)}${adminLine('Документы',f.documentsReady)}${adminLine('Обременения',f.encumbrance)}</div><div class="section"><h3>Ремонт / мебель / техника</h3>${adminLine('Ремонт',f.repairState)}${adminLine('Комментарий',f.repairComment)}${adminLine('Мебель',f.furniture)}${adminLine('Техника',f.appliances)}${adminLine('Что остается',f.remains)}</div><div class="section"><h3>Описание от собственника</h3>${adminLine('Что нравится',f.likes)}${adminLine('Минусы',f.minuses)}${adminLine('Кому подойдет',f.fitFor)}${adminLine('Почему продает',f.sellingReason)}</div><div class="section"><h3>Фото</h3><div class="tiny-media">${photos.length?photos.map(x=>`<div>${x.name}</div>`).join(''):'<p class="meta">Не загружено</p>'}</div></div><div class="section"><h3>Видео</h3><div class="tiny-media">${videos.length?videos.map(x=>`<div>Play · ${x.name}</div>`).join(''):'<p class="meta">Не загружено</p>'}</div></div><div class="section"><h3>Контакты собственника</h3>${adminLine('Имя',item.ownerName||owner.name||'Собственник')}${adminLine('Телефон',item.ownerPhone||owner.phone||'+7')}<div class="actions"><button class="soft" onclick="alert('Номер собственника: ${item.ownerPhone||owner.phone||'+7'}')">Позвонить</button></div></div></section>`}
    function normalizePhone(v){return String(v||'').replace(/\D/g,'')}
    function saveBuyerProfile(){if(!buyer.name.trim()||!buyer.phone.trim()){buyer.message='Введите имя и телефон или продолжите без сохранения.';render();return}const phone=normalizePhone(buyer.phone);let profile=buyer.profiles.find(p=>normalizePhone(p.phone)===phone);if(profile){profile.name=buyer.name;profile.lastActiveAt=new Date().toISOString();buyer.message='Мы нашли ваши прошлые предпочтения.'}else{profile={id:'buyer-'+Date.now(),name:buyer.name,phone:buyer.phone,createdAt:new Date().toISOString(),lastActiveAt:new Date().toISOString()};buyer.profiles.unshift(profile);buyer.message='Рекомендации будут сохранены для следующего входа.'}buyer.active=profile;buyer.guest=false;setTimeout(()=>next(2),350);render()}
    function continueGuest(){buyer.active=null;buyer.guest=true;buyer.message='';next(2)}
    function recordBuyerSignal(propertyId,type){if(!buyer.active)return;buyer.signals.unshift({id:'signal-'+Date.now(),buyerId:buyer.active.id,propertyId,type,createdAt:new Date().toISOString()})}
    function saveBuyerPrefs(){if(!buyer.active)return;buyer.preferences.unshift({buyerId:buyer.active.id,city:'Алматы',district:s.district,budget:s.budget[0],rooms:s.rooms,floorPreference:s.floor,updatedAt:new Date().toISOString()})}
    function rate(type){recordBuyerSignal(current().id,type);s.ratings.push({id:current().id,type}); if(s.ratings.length>=10)next(10); else render()}
    function rateSelected(type){recordBuyerSignal(s.selected.id,type);s.ratings.push({id:s.selected.id,type}); if(s.ratings.length>=10)next(10); else next(8)}
    function detail(x){s.selected=x;s.views.push(x.id);recordBuyerSignal(x.id,'view_details');next(12)}
    function topRecommendations(){const top=[...props].sort((a,b)=>score(b)-score(a)).slice(0,3);top.forEach(x=>recordBuyerSignal(x.id,'final_recommendation'));return top}
    function render(){
      if(s.screen===1)root.innerHTML=`<section class="hero"><div><p class="brand">Gold House</p><h1>Добро пожаловать в Gold House.</h1><p class="sub">Сначала зададим базовые параметры, потом AI изучит ваши действия. Если вы продаете квартиру, откройте кабинет собственника.</p><div class="actions"><button class="primary" onclick="next(15)">Начать поиск</button><button class="soft" onclick="next(20)">Я собственник</button></div><button class="admin-link" onclick="next(30)">Gold Admin</button></div></section>`;
      if(s.screen===15)root.innerHTML=`<section class="screen"><div class="pinbox"><p class="brand">Gold House</p><h2>Хотите сохранить свои рекомендации?</h2><p class="sub">Оставьте имя и номер телефона, чтобы Gold House запомнил ваши лайки, просмотры и подборки. Так рекомендации станут точнее при следующем входе.</p><div class="section"><label class="field"><span>Имя</span><input value="${buyer.name}" oninput="buyer.name=this.value" placeholder="Например, Нурхан"></label><label class="field"><span>Номер телефона</span><input value="${buyer.phone}" oninput="buyer.phone=this.value" placeholder="+7 777 000 00 00"></label>${buyer.message?`<div class="admin-note" style="margin-top:14px">✓ ${buyer.message}</div>`:''}<div class="actions"><button class="primary" onclick="saveBuyerProfile()">Сохранить и продолжить</button><button class="soft" onclick="continueGuest()">Продолжить без сохранения</button></div><p class="meta" style="margin-top:16px">Вы можете пользоваться приложением и без регистрации. Сохранение рекомендаций — это дополнительная возможность.</p></div></div></section>`;
      if(s.screen===2)root.innerHTML=`<section class="screen">${prog(2)}<h2>Какой город вас интересует?</h2><div class="grid choices">${card('Алматы',true,'next(3)','Пока активен Алматы')}</div></section>`;
      if(s.screen===3)root.innerHTML=`<section class="screen">${prog(3)}<h2>Какой район вас интересует?</h2><div class="grid choices">${districts.map(d=>card(d,s.district===d,`s.district='${d}';render()`)).join('')}</div><div class="actions"><button class="primary" onclick="next(4)">Продолжить</button></div></section>`;
      if(s.screen===4)root.innerHTML=`<section class="screen">${prog(4)}<h2>Какой у вас бюджет?</h2><div class="grid choices">${budgets.map((b,i)=>card(b[0],s.budget[0]===b[0],`s.budget=budgets[${i}];render()`)).join('')}</div><div class="actions"><button class="primary" onclick="next(5)">Продолжить</button></div></section>`;
      if(s.screen===5)root.innerHTML=`<section class="screen">${prog(5)}<h2>Сколько комнат вы ищете?</h2><div class="grid choices">${['1','2','3','4+'].map(r=>card(r,s.rooms===r,`s.rooms='${r}';render()`)).join('')}</div><div class="actions"><button class="primary" onclick="next(6)">Продолжить</button></div></section>`;
      if(s.screen===6)root.innerHTML=`<section class="screen">${prog(6)}<h2>Есть ли ограничения по этажу?</h2><div class="grid choices">${floors.map(f=>card(f[1],s.floor===f[0],`s.floor='${f[0]}';render()`,f[2])).join('')}</div><div class="actions"><button class="primary" onclick="saveBuyerPrefs();next(7)">Далее</button></div></section>`;
      if(s.screen===7)root.innerHTML=`<section class="screen">${prog(7)}<div class="loading"><div><div class="ai">AI</div><h2>Помогите AI лучше понять ваши предпочтения.</h2><p class="sub">Оцените несколько квартир. Чем больше оценок, тем точнее будут рекомендации.</p><div class="actions"><button class="primary" onclick="next(8)">Оценить квартиры</button></div></div></div></section>`;
      if(s.screen===8){const x=current();root.innerHTML=`<section class="screen">${prog(8)}<h2>Оцените несколько квартир.</h2><p class="sub">Оценено: ${s.ratings.length}/10</p><article class="card rec"><img src="${x.image}"><div class="body"><div class="badges"><span class="badge">Gold Verified</span><span class="badge">${Math.min(96,Math.round(score(x)/2))}% Match</span></div><p class="price">${money(x.price)}</p><h3>${x.address}</h3><p class="meta">${x.district} · ${x.rooms} комн. · ${x.area} м² · ${x.floor}/${x.totalFloors} этаж</p><div class="actions"><button class="primary" onclick="rate('like')">❤️ Нравится</button><button class="danger" onclick="rate('dislike')">👎 Не нравится</button><button class="soft" onclick="detail(current())">Подробнее</button></div></div></article></section>`}

      if(s.screen===11)root.innerHTML=`<section class="screen"><h2>Персональные рекомендации готовы.</h2><p class="sub">ТОП-3 квартиры на основе ваших лайков, дизлайков и просмотров.</p><div class="grid">${topRecommendations().map((x,i)=>`<article class="card rec"><img src="${x.image}"><div class="body"><div class="badges"><span class="badge">ТОП-${i+1}</span><span class="badge">${Math.min(98,Math.round(score(x)/2))}% Match</span></div><p class="price">${money(x.price)}</p><h3>${x.address}</h3><p class="meta">${x.district} · ${x.rooms} комн. · ${x.area} м² · ${x.floor}/${x.totalFloors} этаж</p><div class="section"><b>Почему AI рекомендует</b><p class="meta">Похожа на квартиры, которым вы поставили ❤️</p><p class="meta">Подходит под ваш бюджет и предпочтения по этажу.</p></div><button class="primary" onclick="detail(props.find(p=>p.id==='${x.id}'))">Подробнее</button></div></article>`).join('')}</div></section>`;
      if(s.screen===12){const x=s.selected;root.innerHTML=`<section class="screen"><button class="ghost" onclick="next(8)">← К оценкам</button><img class="detail-img" src="${x.image}"><div class="body"><div class="badges"><span class="badge">Gold Verified</span><span class="badge">Trust Index 98 / 100</span></div><p class="price">${money(x.price)}</p><h2>${x.address}</h2><p class="meta">${x.district} · ${x.rooms} комн. · ${x.area} м² · ${x.floor}/${x.totalFloors} этаж</p></div><div class="section"><h3>AI Summary</h3><p class="meta">Объект хорошо совпадает с вашим профилем и похож на квартиры, которые вы изучали.</p></div><div class="section"><h3>Видео квартиры / двора / подъезда / собственника</h3><p class="meta">▶ Квартира · ▶ Двор · ▶ Подъезд · ▶ Собственник</p></div><div class="section"><h3>Плюсы</h3><p class="meta">Подходит под бюджет · Фото актуальны · Локация подтверждена</p></div><div class="section"><h3>Минусы</h3><p class="meta">Шум и парковку лучше проверить на просмотре.</p></div><div class="section"><h3>Полные характеристики</h3><p class="meta">${x.rooms} комнат · ${x.area} м² · этаж ${x.floor}/${x.totalFloors}</p></div><div class="detail-actions"><div class="actions" style="margin-top:0"><button class="primary" onclick="rateSelected('like')">❤️ Нравится</button><button class="danger" onclick="rateSelected('dislike')">👎 Не нравится</button></div><button class="primary" onclick="recordBuyerSignal(s.selected.id,'booking_request');next(13)">📅 Записаться на просмотр</button><button class="soft" onclick="recordBuyerSignal(s.selected.id,'call_owner');alert('Номер собственника: ${phone}')">📞 Позвонить собственнику</button></div></section>`}
      if(s.screen===13)root.innerHTML=`<section class="screen"><h2>Выберите дату и время</h2><div class="grid choices">${['Сегодня','Завтра','В выходные'].map(d=>card(d,s.date===d,`s.date='${d}';render()`)).join('')}</div><div class="grid choices">${['12:00','15:30','18:30','20:00'].map(t=>card(t,s.time===t,`s.time='${t}';render()`)).join('')}</div><div class="actions"><button class="primary" onclick="next(14)">Подтвердить</button></div></section>`;
      if(s.screen===14)root.innerHTML=`<section class="screen"><div class="loading"><div><h2>Запрос на просмотр отправлен собственнику.</h2><p class="sub">${s.date}, ${s.time}. Собственник свяжется с вами для подтверждения.</p><div class="actions"><button class="primary" onclick="next(11)">К рекомендациям</button></div></div></div></section>`;
      if(s.screen===20)root.innerHTML=`<section class="screen"><h2>Вход в кабинет собственника</h2><p class="sub">Пока без реальной авторизации. Введите имя и телефон, чтобы открыть кабинет и подать квартиру на проверку.</p><div class="section"><label class="field"><span>Имя</span><input value="${owner.name}" oninput="owner.name=this.value" placeholder="Например, Нурхан"></label><label class="field"><span>Телефон</span><input value="${owner.phone}" oninput="owner.phone=this.value" placeholder="+7 777 000 00 00"></label><div class="actions"><button class="primary" onclick="next(21)">Войти в кабинет</button></div></div></section>`;
      if(s.screen===21)root.innerHTML=`<section class="screen"><h2>Кабинет собственника${owner.name?', '+owner.name:''}</h2><p class="sub">Здесь можно подать объект, сохранить черновик и увидеть статус проверки. Позже эта очередь станет основой админки Gold House.</p><div class="actions"><button class="primary" onclick="owner.step=1;next(22)">Подать объявление</button><button class="soft" onclick="next(24)">Очередь для админки</button></div><div class="section"><h3>Мои объявления</h3>${owner.submissions.map(item=>`<div class="section"><span class="status">${item.status}</span><h3 style="margin-top:12px">${item.title}</h3><p class="meta">${item.address} · ${item.meta}</p><p class="price" style="font-size:24px;margin-top:10px">${item.price}</p></div>`).join('')}</div></section>`;
      if(s.screen===22)root.innerHTML=`<section class="screen">${ownerProgress()}<div class="owner-head"><div><p class="owner-step">Кабинет собственника</p><h2>${ownerTitle()}</h2></div><button class="ghost" onclick="next(21)">В кабинет</button></div><div class="section">${ownerBody()}<div class="actions"><button class="ghost" onclick="owner.step>1?(owner.step--,render()):next(21)">Назад</button>${owner.step<9?'<button class="primary" onclick="owner.step++;render()">Далее</button>':'<button class="soft" onclick="saveOwnerSubmission(\'Черновик\')">Сохранить черновик</button><button class="primary" onclick="saveOwnerSubmission(\'Отправлена\')">Отправить заявку</button>'}</div></div></section>`;
      if(s.screen===23)root.innerHTML=`<section class="screen"><h2>Предпросмотр объявления</h2>${ownerPreview()}<div class="actions"><button class="ghost" onclick="owner.step=8;next(22)">Назад</button><button class="soft" onclick="saveOwnerSubmission('Черновик')">Сохранить черновик</button><button class="primary" onclick="saveOwnerSubmission('Отправлена')">Отправить заявку</button></div></section>`;
      if(s.screen===24)root.innerHTML=`<section class="screen"><h2>Будущая админка Gold House</h2><p class="sub">MVP-предпросмотр очереди, куда будут попадать заявки собственников для проверки.</p><div class="section">${owner.submissions.map(item=>`<div class="section"><span class="status">${item.status}</span><h3 style="margin-top:12px">${item.title}</h3><p class="meta">${item.address}</p><div class="actions"><button class="soft">На проверке</button><button class="soft">Нужна съемка</button><button class="primary">Одобрена</button></div></div>`).join('')}</div><div class="actions"><button class="ghost" onclick="next(21)">В кабинет</button></div></section>`;
      if(s.screen===30)root.innerHTML=`<section class="screen"><div class="pinbox"><p class="brand">Gold Admin</p><h2>Скрытый кабинет администратора</h2><p class="sub">Введите PIN-код владельца, чтобы открыть заявки собственников.</p><div class="section"><label class="field"><span>PIN-код</span><input value="${admin.pin}" oninput="admin.pin=this.value" placeholder="0707" type="password"></label>${admin.error?`<p class="danger" style="padding:12px;border-radius:14px;margin-top:12px">${admin.error}</p>`:''}<div class="actions"><button class="primary" onclick="adminLogin()">Войти</button><button class="ghost" onclick="next(1)">На главную</button></div></div></div></section>`;
      if(s.screen===31)root.innerHTML=`<section class="screen"><div class="owner-head"><div><p class="owner-step">Gold Admin</p><h2>Панель администратора</h2><p class="sub">Заявки собственников, проверка, съемка, одобрение и публикация в каталог покупателей.</p></div><button class="ghost" onclick="next(1)">Главная</button></div><div class="admin-stats">${adminStatusList().map(st=>`<div class="admin-stat"><b>${statusCount(st)}</b><p class="meta">${st}</p></div>`).join('')}</div><div class="section"><h3>Все заявки</h3>${owner.submissions.map(adminSubmissionCard).join('')}</div></section>`;
      if(s.screen===32)root.innerHTML=adminDetail();
      if(s.screen===25)root.innerHTML=`<section class="screen"><div class="success"><div><p class="brand">Gold House</p><h2>Заявка отправлена.</h2><p class="sub">Команда Gold House проверит объект и свяжется с вами.</p><div class="actions"><button class="primary" onclick="next(21)">Вернуться в кабинет</button></div></div></div></section>`;
    }
    render();
  </script>
</body>
</html>
