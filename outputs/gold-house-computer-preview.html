3;&#1088;&#1072;&#1085;&#1080;&#1090;&#1100;</button><button class="call-cta" onclick="recordBuyerSignal(s.selected.id,'owner_call'); location.href='tel:'+phone.replace(/\s/g,'')">&#1055;&#1086;&#1079;&#1074;&#1086;&#1085;&#1080;&#1090;&#1100;</button><button class="like-cta" onclick="rateSelected('like')">&#1053;&#1088;&#1072;&#1074;&#1080;&#1090;&#1089;&#1103;</button><button class="dislike-cta" onclick="rateSelected('dislike')">&#1053;&#1077; &#1085;&#1088;&#1072;&#1074;&#1080;&#1090;&#1089;&#1103;</button><button class="primary gold-cta wide" onclick="recordBuyerSignal(s.selected.id,'booking_request');next(13)">&#1061;&#1086;&#1095;&#1091; &#1087;&#1086;&#1089;&#1084;&#1086;&#1090;&#1088;&#1077;&#1090;&#1100;<span class="hint">&#1042;&#1099;&#1073;&#1088;&#1072;&#1090;&#1100; &#1076;&#1072;&#1090;&#1091; &#1080; &#1074;&#1088;&#1077;&#1084;&#1103;</span></button></div></section>`}
      if(s.screen===13)root.innerHTML=`<section class="screen"><h2>Выберите дату и время</h2><div class="grid choices">${['Сегодня','Завтра','Р’ выходные'].map(d=>card(d,s.date===d,`s.date='${d}';render()`)).join('')}</div><div class="grid choices">${['12:00','15:30','18:30','20:00'].map(t=>card(t,s.time===t,`s.time='${t}';render()`)).join('')}</div><div class="actions"><button class="primary" onclick="next(14)">Подтвердить</button></div></section>`;
      if(s.screen===14)root.innerHTML=`<section class="screen"><div class="loading"><div><h2>Запрос на просмотр отправлен собственнику.</h2><p class="sub">${s.date}, ${s.time}. Собственник свяжется с вами для подтверждения.</p><div class="actions"><button class="primary" onclick="next(11)">К рекомендациям</button></div></div></div></section>`;
      if(s.screen===20)root.innerHTML=`<section class="screen"><h2>Вход в кабинет собственника</h2><p class="sub">Пока без реальной авторизации. Введите имя и телефон, чтобы открыть кабинет и подать квартиру на проверку.</p><div class="section"><label class="field"><span>РРјСЏ</span><input value="${owner.name}" oninput="owner.name=this.value" placeholder="Например, Нурхан"></label><label class="field"><span>Телефон</span><input value="${owner.phone}" oninput="owner.phone=this.value" placeholder="+7 777 000 00 00"></label><div class="actions"><button class="primary" onclick="next(21)">Войти в кабинет</button></div></div></section>`;
      if(s.screen===21)root.innerHTML=`<section class="screen"><h2>Кабинет собственника${owner.name?', '+owner.name:''}</h2><p class="sub">Здесь можно подать объект, сохранить черновик и увидеть статус проверки Gold House.</p><div class="actions"><button class="primary" onclick="owner.step=1;next(22)">Подать объявление</button></div><div class="section"><h3>Мои объявления</h3>${owner.submissions.map(item=>`<div class="section"><span class="status">${item.status}</span><h3 style="margin-top:12px">${item.title}</h3><p class="meta">${item.address} В· ${item.meta}</p><p class="price" style="font-size:24px;margin-top:10px">${item.price}</p></div>`).join('')}</div></section>`;
      if(s.screen===22)root.innerHTML=`<section class="screen">${ownerProgress()}<div class="owner-head"><div><p class="owner-step">Кабинет собственника</p><h2>${ownerTitle()}</h2></div><button class="ghost" onclick="next(21)">Р’ кабинет</button></div><div class="section">${ownerBody()}<div class="actions"><button class="ghost" onclick="owner.step>1?(owner.step--,render()):next(21)">Назад</button>${owner.step<9?'<button class="primary" onclick="owner.step++;render()">Далее</button>':'<button class="soft" onclick="saveOwnerSubmission(\'Черновик\')">Сохранить черновик</button><button class="primary" onclick="saveOwnerSubmission(\'Отправлена\')">Отправить заявку</button>'}</div></div></section>`;
      if(s.screen===23)root.innerHTML=`<section class="screen"><h2>Предпросмотр объявления</h2>${ownerPreview()}<div class="actions"><button class="ghost" onclick="owner.step=8;next(22)">Назад</button><button class="soft" onclick="saveOwnerSubmission('Черновик')">Сохранить черновик</button><button class="primary" onclick="saveOwnerSubmission('Отправлена')">Отправить заявку</button></div></section>`;
      if(s.screen===24)next(21);
      if(s.screen===30){if(!adminAllowed()){root.innerHTML=`<section class="screen"><div class="pinbox"><p class="brand">Gold House</p><h2>Доступ запрещен</h2><p class="sub">Эта страница доступна только администраторам Gold House.</p><div class="actions"><button class="primary" onclick="next(1)">Вернуться в главное меню</button></div></div></section>`}else root.innerHTML=`<section class="screen"><div class="pinbox"><p class="brand">Gold Admin</p><h2>Скрытый кабинет администратора</h2><p class="sub">Введите PIN-код владельца, чтобы открыть заявки собственников.</p><div class="section"><label class="field"><span>PIN-код</span><input value="${admin.pin}" oninput="admin.pin=this.value" placeholder="0707" type="password"></label>${admin.error?`<p class="danger" style="padding:12px;border-radius:14px;margin-top:12px">${admin.error}</p>`:''}<div class="actions"><button class="primary" onclick="adminLogin()">Войти</button><button class="ghost" onclick="next(1)">На главную</button></div></div></div></section>`}
      if(s.screen===31)root.innerHTML=`<section class="screen"><div class="owner-head"><div><p class="owner-step">Gold Admin</p><h2>Панель администратора</h2><p class="sub">Заявки собственников, проверка, съемка, одобрение и публикация в каталог покупателей.</p></div><button class="ghost" onclick="next(1)">Главная</button></div><div class="admin-stats">${adminStatusList().map(st=>`<div class="admin-stat"><b>${statusCount(st)}</b><p class="meta">${st}</p></div>`).join('')}</div><div class="section"><h3>Все заявки</h3>${owner.submissions.map(adminSubmissionCard).join('')}</div></section>`;
      if(s.screen===32)root.innerHTML=adminDetail();
      if(s.screen===25)root.innerHTML=`<section class="screen"><div class="success"><div><p class="brand">Gold House</p><h2>Заявка отправлена.</h2><p class="sub">Команда Gold House проверит объект и свяжется с вами.</p><div class="actions"><button class="primary" onclick="next(21)">Вернуться в кабинет</button></div></div></div></section>`;
    }
    document.addEventListener('click',closeProfileMenu);
    render();
  </script>
